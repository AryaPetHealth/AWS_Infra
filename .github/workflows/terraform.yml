name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_VAR_apple_services_id: ${{ secrets.APPLE_SERVICES_ID }}
  TF_VAR_apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
  TF_VAR_apple_key_id: ${{ secrets.APPLE_KEY_ID }}
  TF_VAR_apple_private_key: ${{ secrets.APPLE_PRIVATE_KEY }}
  TF_VAR_cognito_callback_urls: ${{ secrets.COGNITO_CALLBACK_URLS }}
  TF_VAR_cognito_logout_urls: ${{ secrets.COGNITO_LOGOUT_URLS }}
  TF_VAR_apns_signing_key: ${{ secrets.APNS_SIGNING_KEY }}
  TF_VAR_apns_signing_key_id: ${{ secrets.APNS_SIGNING_KEY_ID }}
  TF_VAR_apns_team_id: ${{ secrets.APNS_TEAM_ID }}
  TF_VAR_apns_bundle_id: ${{ secrets.APNS_BUNDLE_ID }}
  TF_VAR_documents_bucket_name: ${{ secrets.DOCUMENTS_BUCKET_NAME }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No backend block is checked in (so local runs default to local
      # state) — CI supplies one here, pointing at the bucket bootstrap/
      # created, via an override file merged in at init time.
      - name: Configure remote state backend
        run: |
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "arya/terraform.tfstate"
              region       = "${{ env.AWS_REGION }}"
              use_lockfile = true
              encrypt      = true
            }
          }
          EOF

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
